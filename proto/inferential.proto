syntax = "proto3";

package inferential;

enum DType {
    DTYPE_UNSPECIFIED = 0;
    FLOAT16 = 1;
    FLOAT32 = 2;
    FLOAT64 = 3;
    BFLOAT16 = 4;
    UINT8 = 5;
    INT32 = 6;
    INT64 = 7;
    BOOL = 8;
}

enum Encoding {
    ENCODING_UNSPECIFIED = 0;
    RAW = 1;
    JPEG = 2;
    PNG = 3;
}

message Client {
    string id = 1;
    string type = 2;              // "franka", "ur5", "sim"
}

message Tensor {
    string key = 1;               // "camera/wrist", "proprioception"
    DType dtype = 2;
    repeated int64 shape = 3;
    uint64 byte_offset = 4;
    uint64 byte_length = 5;
    uint64 timestamp_ns = 6;      // per-tensor temporal alignment
    Encoding encoding = 7;
}

message Observation {
    Client client = 1;
    uint64 timestamp_ns = 2;
    float urgency = 3;            // 0.0 (low) to 1.0 (critical)
    repeated Tensor tensors = 4;
    string model_id = 5;
    optional uint32 steps_remaining = 6;  // optional hint from robot
    map<string, string> metadata = 7;
    uint32 priority = 8;          // 0 = highest priority
}

message ModelResponse {
    Client client = 1;
    string response_id = 2;
    uint64 timestamp_ns = 3;
    repeated Tensor tensors = 4;
    float inference_latency_ms = 5;
    string model_id = 6;
    map<string, string> metadata = 7;
}
