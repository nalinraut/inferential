name: Publish to crates.io

on:
  workflow_run:
    workflows: [Auto Tag and Release]
    types: [completed]

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: sudo apt-get update && sudo apt-get install -y libzmq3-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - run: mkdir -p rust/.proto && cp proto/inferential.proto rust/.proto/inferential.proto
      - name: Publish to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "inferential-ci/1.0" "https://crates.io/api/v1/crates/inferential/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "inferential@${VERSION} already on crates.io — skipping"
          else
            cargo publish --allow-dirty
          fi
